<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --cream: #FFFBF5;
    --warm: #FFF7EE;
    --soft: #FFF3E6;
    --coral: #DA4F45;
    --coral-glow: #FF6B5E;
    --peach: #FFB088;
    --golden: #F5A623;
    --charcoal: #1A1612;
    --muted: #5C5549;
    --faded: #9B9286;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ccc; }

  .slide {
    position: relative;
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    background:
      radial-gradient(1200px 900px at 80% -8%, rgba(255,176,136,0.28), transparent 60%),
      radial-gradient(1000px 800px at -10% 18%, rgba(218,79,69,0.10), transparent 55%),
      linear-gradient(180deg, var(--warm) 0%, var(--cream) 45%, var(--soft) 100%);
    font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Ambient orbs */
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .orb.a { top: -120px; right: -80px; width: 620px; height: 620px; background: rgba(218,79,69,0.10); }
  .orb.b { bottom: 240px; left: -140px; width: 560px; height: 560px; background: rgba(245,166,35,0.10); }

  /* Wordmark */
  .wordmark {
    position: relative; z-index: 2;
    display: inline-flex; align-items: center; gap: 14px;
    margin-top: 120px;
  }
  .wordmark .icon {
    width: 56px; height: 56px; border-radius: 16px; background: var(--coral);
    display: flex; align-items: center; justify-content: center;
  }
  .wordmark .name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 34px; color: var(--charcoal); letter-spacing: -0.5px;
  }
  .wordmark .name b { font-weight: 700; }

  /* Headline. The copy block flexes to fill the space between the wordmark
     and the device and centers its text in it — so a one-line headline gets
     balanced negative space instead of one large gap above the phone. */
  .copy {
    position: relative; z-index: 2; text-align: center; padding: 0 110px;
    margin-top: 24px;
    flex: 1 0 auto;
    display: flex; flex-direction: column; justify-content: center;
  }
  .headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 92px;
    line-height: 1.04;
    letter-spacing: -1.5px;
    color: var(--charcoal);
  }
  .headline .accent { color: var(--coral); }
  .sub {
    margin-top: 34px;
    font-size: 38px;
    line-height: 1.42;
    color: var(--muted);
    font-weight: 400;
    padding: 0 30px;
  }

  /* Phone — slightly larger than the original 880px spec so short-copy slides
     don't leave a sea of empty background above the device. */
  .phone-wrap {
    position: relative; z-index: 2;
    margin-top: 24px; margin-bottom: -2px;
    filter: drop-shadow(0 40px 90px rgba(218,79,69,0.18)) drop-shadow(0 18px 50px rgba(0,0,0,0.12));
  }
  .phone {
    width: {{DEVICE_W}}px;
    background: var(--charcoal);
    border-radius: {{DEVICE_R}}px;
    padding: {{DEVICE_PAD}}px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06);
  }
  .screen {
    position: relative;
    width: 100%;
    aspect-ratio: {{SCREEN_AR}};
    border-radius: {{SCREEN_R}}px;
    overflow: hidden;
    background: var(--cream);
  }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .placeholder {
    width: 100%; height: 100%;
    display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 24px;
    background: linear-gradient(160deg, rgba(218,79,69,0.16), rgba(255,176,136,0.20));
    text-align: center; padding: 60px;
  }
  .placeholder .label {
    font-family: Georgia, serif; font-size: 64px; color: var(--coral);
  }
  .placeholder .hint { font-size: 30px; color: var(--muted); }
  {{THEME_CSS}}
</style>
</head>
<body>
<div class="slide" id="slide">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="wordmark">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 1024 1024" fill="none">
        <rect x="310" y="442" width="56" height="140" rx="28" fill="white" opacity="0.7"/>
        <rect x="398" y="362" width="56" height="300" rx="28" fill="white" opacity="0.85"/>
        <rect x="486" y="302" width="56" height="420" rx="28" fill="white"/>
        <rect x="574" y="382" width="56" height="260" rx="28" fill="white" opacity="0.8"/>
        <rect x="662" y="462" width="56" height="100" rx="28" fill="white" opacity="0.6"/>
      </svg>
    </div>
    <div class="name">{{WORDMARK}}</div>
  </div>
  <div class="copy">
    <div class="headline">{{HEADLINE}}</div>
    <div class="sub">{{SUB}}</div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="screen">{{SCREEN_BLOCK}}</div>
    </div>
  </div>
</div>
</body>
</html>
