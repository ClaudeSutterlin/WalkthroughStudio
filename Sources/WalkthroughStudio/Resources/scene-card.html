<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><style>
  :root {
    --cream: #FFFBF5; --warm: #FFF7EE; --soft: #FFF3E6;
    --coral: #DA4F45; --accent: #DA4F45; --coral-glow: #FF6B5E; --peach: #FFB088; --golden: #F5A623;
    --charcoal: #1A1612; --muted: #5C5549; --faded: #9B9286;
    --line: #E3D5C3;
    --code-bg: #1A1612; --code-fg: #F2E8DC; --code-dim: #8C8073;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ccc; }
  .scene {
    position: relative; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden;
    background:
      radial-gradient(1200px 900px at 85% -10%, rgba(255,176,136,0.24), transparent 60%),
      radial-gradient(1000px 800px at -10% 20%, rgba(218,79,69,0.08), transparent 55%),
      linear-gradient(180deg, var(--warm) 0%, var(--cream) 50%, var(--soft) 100%);
    font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: calc({{HEIGHT}}px * 0.055) calc({{WIDTH}}px * 0.045);
  }
  .scene { justify-content: center; }
  .kicker {
    font-size: calc({{HEIGHT}}px * 0.026); letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: calc({{HEIGHT}}px * 0.03);
  }
  .claim {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: calc({{HEIGHT}}px * 0.062); line-height: 1.28; color: var(--charcoal);
    letter-spacing: -0.5px; max-width: 88%;
  }
  .evidence {
    margin-top: calc({{HEIGHT}}px * 0.055);
    display: flex; flex-wrap: wrap; gap: calc({{HEIGHT}}px * 0.016);
  }
  .evidence .chip {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: calc({{HEIGHT}}px * 0.022); color: var(--charcoal);
    background: rgba(255,255,255,0.72); border: 1px solid var(--line);
    padding: calc({{HEIGHT}}px * 0.010) calc({{HEIGHT}}px * 0.020);
    border-radius: 999px;
  }
  .hedge {
    margin-top: calc({{HEIGHT}}px * 0.03);
    font-size: calc({{HEIGHT}}px * 0.024); color: var(--muted); font-style: italic;
  }
  .hedge.empty { display: none; }
  {{THEME_CSS}}
</style></head>
<body><div class="scene">
  <div class="kicker">{{KICKER}}</div>
  <div class="claim">{{CLAIM}}</div>
  <div class="evidence">{{CHIPS}}</div>
  <div class="hedge {{HEDGE_CLASS}}">{{HEDGE}}</div>
</div></body>
</html>
