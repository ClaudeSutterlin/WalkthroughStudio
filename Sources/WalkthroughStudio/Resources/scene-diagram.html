<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><style>
  :root {
    --cream: #FFFBF5; --warm: #FFF7EE; --soft: #FFF3E6;
    --coral: #DA4F45; --accent: #DA4F45; --coral-glow: #FF6B5E; --peach: #FFB088; --golden: #F5A623;
    --charcoal: #1A1612; --muted: #5C5549; --faded: #9B9286;
    --line: #E3D5C3;
    --code-bg: #1A1612; --code-fg: #F2E8DC; --code-dim: #8C8073;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ccc; }
  .scene {
    position: relative; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden;
    background:
      radial-gradient(1200px 900px at 85% -10%, rgba(255,176,136,0.24), transparent 60%),
      radial-gradient(1000px 800px at -10% 20%, rgba(218,79,69,0.08), transparent 55%),
      linear-gradient(180deg, var(--warm) 0%, var(--cream) 50%, var(--soft) 100%);
    font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: calc({{HEIGHT}}px * 0.055) calc({{WIDTH}}px * 0.045);
  }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: calc({{HEIGHT}}px * 0.024); }
  .head .title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: calc({{HEIGHT}}px * 0.052); color: var(--charcoal); letter-spacing: -0.5px;
  }
  .head .where { font-size: calc({{HEIGHT}}px * 0.024); color: var(--muted); }
  .canvas {
    flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
  }
  .canvas svg { max-width: 100%; max-height: 100%; height: auto; }
  /* Focused nodes: the diagram is already on screen, so the shot's job is to say which
     boxes the narrator is talking about right now. */
  .canvas .focus rect, .canvas .focus polygon, .canvas .focus circle, .canvas .focus path {
    stroke: {{FOCUS_COLOR}} !important; stroke-width: 3px !important;
    filter: drop-shadow(0 0 calc({{HEIGHT}}px * 0.012) rgba(218,79,69,0.45));
  }
  .canvas .dim { opacity: 0.38; }
  .legend {
    flex: 0 0 auto; margin-top: calc({{HEIGHT}}px * 0.026);
    display: flex; flex-wrap: wrap; gap: calc({{HEIGHT}}px * 0.014);
  }
  .legend .chip {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: calc({{HEIGHT}}px * 0.021); color: var(--cream); background: var(--accent);
    padding: calc({{HEIGHT}}px * 0.008) calc({{HEIGHT}}px * 0.018); border-radius: 999px;
  }
  .legend.empty { visibility: hidden; }
  {{THEME_CSS}}
</style></head>
<body><div class="scene">
  <div class="head"><div class="title">{{TITLE}}</div><div class="where">{{WHERE}}</div></div>
  <div class="canvas">{{SVG}}</div>
  <div class="legend {{LEGEND_CLASS}}">{{CHIPS}}</div>
</div></body>
</html>
